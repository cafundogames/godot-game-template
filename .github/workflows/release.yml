name: Godot App Release

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: Publish to ItchIo?
        default: false

defaults:
  run:
    shell: nu {0}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        preset:
          - linux
          - windows
          - web

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: cafundogames
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.112.2"
          enable-plugins: true

      - name: Get Info
        run: |
          let preset  = ${{matrix.preset}}
          let version = open project.config.json | get version? | default '1.0.0'
          let name    = open project.config.json | get name?    | default 'Godot Game Template'
          let pname   = open project.config.json | get pname?   | default 'godot-game-template'
          let itchio  = open project.config.json | get itchio?  | default {username:'',gamename:''} | to json -r

          $"preset=($preset)
          version=($version)
          name=($name)
          pname=($pname)
          itchuser=($itchio.username)
          itchgame=($itchio.gamename)" | save -a $env.GITHUB_ENV

      - name: Build ${{matrix.preset}} preset
        run: nix build .#${{matrix.preset}}

      - name: preparing zips
        run: |
          mkdir -v ./build/($env.pname)
          cp -rv ./result/share/($env.pname)/* ./build/($env.pname)
          ^zip ./build/($env.pname)-($env.preset).zip ./build/($env.pname)/*

      - name: Upload Package to GitHub Releases
        uses: ncipollo/release-action@v1.20.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: ./build/${{env.pname}}-${{matrix.preset}}.zip
          artifactContentType: zip
          bodyFile: ./RELEASE.md
          tag: ${{ env.version }}
          name: "${{ env.version }}"

      - name: Setup Butler
        if: env.itchuser != '' && env.itchgame != ''
        uses: remarkablegames/setup-butler@v2
        with:
          butler-version: LATEST

      - name: Butler Push
        if: env.itchuser != '' && env.itchgame != ''
        run: ^butler push --fix-permissions --userversion=$env.version ./build/($env.pname) $"($env.itchuser)/($env.itchgame):($env.preset)"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
